# DailyReport 配置示例（复制为 config.yaml 后按需填写）
# config.yaml 已在 .gitignore 中，请勿把真实密钥提交到仓库

git:
  repos:
    - name: "示例项目"
      path: "E:/path/to/your/repo"
    # 远程仓库示例:
    # - name: "远程项目"
    #   remote: "https://github.com/user/project.git"
    #   branch: "main"

  account:
    username: "your-git-username"
    password: "your-git-token-or-password"

ai:
  apiKey: "${MINIMAX_API_KEY:}"
  baseUrl: "https://api.minimax.cn/v1"
  model: "MiniMax-M3.1-Flash"
  maxRetries: 3
  retryDelayMs: 1000
  connectTimeoutMs: 5000
  readTimeoutMs: 60000
  failureThreshold: 2
  cooldownMs: 120000
  # 绩效评估等长文：Web「AI 设置」策略 longReadTimeoutMs 默认 300000（5 分钟）
  fallback:
    enabled: true
    apiKey: "${DEEPSEEK_API_KEY:}"
    baseUrl: "https://api.deepseek.com"
    model: "deepseek-v4-pro"
    connectTimeoutMs: 5000
    readTimeoutMs: 60000

report:
  templateDir: "./templates"
  outputDir: "./output"
  dailyTemplate: "daily_template.xlsx"
  weeklyTemplate: "weekly_template.xlsx"
  monthlyTemplate: "monthly_template.xlsx"

scheduler:
  enabled: false
  cron: "0 0 18 * * ?"

# 绩效评估（独立于月报 period_report）
performance:
  department: "技术部"
  role: "java"
  assessee: ""
  assessor: ""
  templatePath: "./templates/performance/performance_template.xlsx"
  # 指向本机历史 MonthPerformance 目录，仅用最新 xlsx 复制样式，勿将含真实姓名的文件提交到 git
  # 示例: "E:/IdeaSelfSpace/MonthPerformance"
  templateSearchDir: ""
  scoreKpi: 55
  scoreAuxiliary: 18
  scoreAttitude: 20
  scoreOther: 0

# 绩效面谈（独立于绩效评估与月报）
interview:
  department: "技术部"
  role: "java"
  assessee: ""
  # 入职日期，写入 Excel I2（yyyy-MM-dd）
  hireDate: ""
  templatePath: "./templates/interview/interview_template.xlsx"
  # 本机 MonthFace 目录，仅用最新 xlsx 复制版式；勿将含真实姓名的文件提交到 git
  # 示例: "E:/IdeaSelfSpace/MonthFace"
  templateSearchDir: ""
